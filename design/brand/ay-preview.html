<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AY 融合标志 · 独立设计预览</title>
    <link rel="icon" type="image/svg+xml" href="./ay-mark.svg" />
    <style>
      @font-face {
        font-family: 'AlexYe Sans';
        src: url('../../public/fonts/google-sans-flex-latin.woff2')
          format('woff2');
        font-weight: 350 750;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eaf0ec;
        color: #18231e;
        font-family: 'AlexYe Sans', 'PingFang SC', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 1160px;
        margin: auto;
        padding: 36px 32px 30px;
      }
      .intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.18em;
        color: #66736d;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.4;
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      .intro-note {
        margin: 0 0 3px;
        color: #66736d;
        font-size: 12px;
        white-space: nowrap;
      }
      .themes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .panel {
        padding: 26px 28px;
        border: 1px solid #dce5e0;
        border-radius: 18px;
        background: #f7faf9;
        color: #176b55;
      }
      .panel.dark {
        background: #111a16;
        color: #78dcb2;
        border-color: #26372e;
      }
      .panel-label {
        margin: 0;
        color: #66736d;
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0.08em;
      }
      .dark .panel-label {
        color: #8a9c92;
      }
      .mark {
        display: block;
        flex-shrink: 0;
        fill: currentColor;
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 0 28px;
      }
      .hero .mark {
        width: 184px;
        height: 184px;
      }
      .wordmark {
        margin: 6px 0 0;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.035em;
      }
      .sizes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        align-items: end;
        border-top: 1px solid #dce5e0;
        padding-top: 20px;
      }
      .dark .sizes {
        border-top-color: #2b3c32;
      }
      .sample {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .sample-icon {
        height: 52px;
        display: flex;
        align-items: center;
      }
      .sample small {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: #66736d;
      }
      .dark .sample small {
        color: #8a9c92;
      }
      .contexts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      .context {
        padding: 20px 24px;
        border: 1px solid #dce5e0;
        border-radius: 14px;
        background: #fff;
      }
      .context-title {
        margin: 0 0 16px;
        font-size: 11px;
        color: #66736d;
        letter-spacing: 0.06em;
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #18231e;
        font-size: 20px;
        font-weight: 650;
        font-variation-settings: 'ROND' 18;
      }
      .nav-brand .mark {
        width: 32px;
        height: 32px;
        color: #176b55;
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 14px;
        background: #eff5f2;
        border-radius: 9px;
        color: #18231e;
        font-size: 12px;
        white-space: nowrap;
      }
      .tab .mark {
        width: 16px;
        height: 16px;
        color: #176b55;
      }
      .tab.dark-tab {
        background: #191d1f;
        color: #edf4f0;
      }
      .dark-tab .mark {
        color: #78dcb2;
      }
      footer {
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: #66736d;
        font-size: 11px;
        line-height: 1.7;
      }
      footer p {
        margin: 0;
      }
      @media (max-width: 760px) {
        main {
          padding: 26px 18px;
        }
        .intro {
          display: block;
        }
        h1 {
          font-size: 23px;
        }
        .intro-note {
          margin-top: 10px;
        }
        .themes,
        .contexts {
          grid-template-columns: 1fr;
        }
        .panel {
          padding: 24px;
        }
        .tabs {
          flex-wrap: wrap;
          gap: 10px;
        }
        footer {
          display: block;
        }
        footer p + p {
          margin-top: 6px;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="ay-preview-mark">
          <path
            d="M44 37Q46 34 48 37L76 88V74L48 25Q44 20 50 20H63Q65 20 67 23L91 68Q94 72 94 77V106Q94 108 92 108H74Q71 108 69 105L46 65L34 89H53Q58 89 55 94L48 105Q47 108 44 108H11Q6 108 9 103L42 39Q43 37 44 37Z"
          />
          <path
            d="M102 20H119Q123 20 120 25L98 63Q96 67 94 64L87 53Q84 50 86 46L100 23Q101 20 102 20Z"
          />
        </g>
      </defs>
    </svg>
    <main>
      <header class="intro">
        <div>
          <p class="eyebrow">ALEX YE LAB / CONCEPT 03 · V1</p>
          <h1>AY 融合标志 · SVG 精修</h1>
        </div>
        <p class="intro-note">已选用为站点标志 · 本页为设计预览</p>
      </header>
      <section class="themes" aria-label="深浅背景与实际尺寸">
        <article class="panel">
          <h2 class="panel-label">浅色 / 墨绿</h2>
          <div class="hero">
            <svg
              class="mark"
              viewBox="0 0 128 128"
              role="img"
              aria-label="墨绿色 AY 融合标志"
            >
              <use href="#ay-preview-mark" />
            </svg>
            <p class="wordmark">Alex Ye Lab</p>
          </div>
          <div class="sizes">
            <div class="sample">
              <div class="sample-icon">
                <svg
                  class="mark"
                  width="16"
                  height="16"
                  viewBox="0 0 128 128"
                  aria-hidden="true"
                >
                  <use href="#ay-preview-mark" />
                </svg>
              </div>
              <small>16 px</small>
            </div>
            <div class="sample">
              <div class="sample-icon">
                <svg
                  class="mark"
                  width="24"
                  height="24"
                  viewBox="0 0 128 128"
                  aria-hidden="true"
                >
                  <use href="#ay-preview-mark" />
                </svg>
              </div>
              <small>24 px</small>
            </div>
            <div class="sample">
              <div class="sample-icon">
                <svg
                  class="mark"
                  width="32"
                  height="32"
                  viewBox="0 0 128 128"
                  aria-hidden="true"
                >
                  <use href="#ay-preview-mark" />
                </svg>
              </div>
              <small>32 px</small>
            </div>
            <div class="sample">
              <div class="sample-icon">
                <svg
                  class="mark"
                  width="48"
                  height="48"
                  viewBox="0 0 128 128"
                  aria-hidden="true"
                >
                  <use href="#ay-preview-mark" />
                </svg>
              </div>
              <small>48 px</small>
            </div>
          </div>
        </article>
        <article class="panel dark">
          <h2 class="panel-label">深色 / 薄荷绿</h2>
          <div class="hero">
            <svg
              class="mark"
              viewBox="0 0 128 128"
              role="img"
              aria-label="薄荷绿色 AY 融合标志"
            >
              <use href="#ay-preview-mark" />
            </svg>
            <p class="wordmark">Alex Ye Lab</p>
          </div>
          <div class="sizes">
            <div class="sample">
              <div class="sample-icon">
                <svg
                  class="mark"
                  width="16"
                  height="16"
                  viewBox="0 0 128 128"
                  aria-hidden="true"
                >
                  <use href="#ay-preview-mark" />
                </svg>
              </div>
              <small>16 px</small>
            </div>
            <div class="sample">
              <div class="sample-icon">
                <svg
                  class="mark"
                  width="24"
                  height="24"
                  viewBox="0 0 128 128"
                  aria-hidden="true"
                >
                  <use href="#ay-preview-mark" />
                </svg>
              </div>
              <small>24 px</small>
            </div>
            <div class="sample">
              <div class="sample-icon">
                <svg
                  class="mark"
                  width="32"
                  height="32"
                  viewBox="0 0 128 128"
                  aria-hidden="true"
                >
                  <use href="#ay-preview-mark" />
                </svg>
              </div>
              <small>32 px</small>
            </div>
            <div class="sample">
              <div class="sample-icon">
                <svg
                  class="mark"
                  width="48"
                  height="48"
                  viewBox="0 0 128 128"
                  aria-hidden="true"
                >
                  <use href="#ay-preview-mark" />
                </svg>
              </div>
              <small>48 px</small>
            </div>
          </div>
        </article>
      </section>
      <section class="contexts" aria-label="实际使用组合示意">
        <div class="context">
          <h2 class="context-title">导航组合 / 沿用网站字体</h2>
          <div class="nav-brand">
            <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
              <use href="#ay-preview-mark" /></svg
            ><span>Alex Ye Lab</span>
          </div>
        </div>
        <div class="context">
          <h2 class="context-title">浏览器标签示意 / 16 px</h2>
          <div class="tabs">
            <div class="tab">
              <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
                <use href="#ay-preview-mark" /></svg
              ><span>Alex Ye Lab</span>
            </div>
            <div class="tab dark-tab">
              <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
                <use href="#ay-preview-mark" /></svg
              ><span>Alex Ye Lab</span>
            </div>
          </div>
        </div>
      </section>
      <footer>
        <p>透明底 · 两段实心路径 · 无渐变与纹理</p>
        <p>尺寸按 CSS 像素展示；本页不属于网站正式路由。</p>
      </footer>
    </main>
  </body>
</html>
